name: Update RLUSD hourly data

on:
  schedule:
    - cron: "7 * * * *"   # 每小时第 7 分运行（UTC）
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest hourly balances
        run: python3 scripts/update_hourly.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: hourly RLUSD update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
