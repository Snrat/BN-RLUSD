name: Update RLUSD hourly data

on:
  schedule:
    # 每 10 分钟一班（GitHub 定时器会随机丢班次，6 班/小时互为兜底；
    # 脚本幂等且会补齐缺失小时点，重复运行无副作用）
    - cron: "4,14,24,34,44,54 * * * *"   # UTC
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest hourly balances
        run: python3 scripts/update_hourly.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: hourly RLUSD update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
