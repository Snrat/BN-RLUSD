<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币安 RLUSD 实时统计 & APR 预估</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: rgba(255, 255, 255, 0.85);
    --border: rgba(15, 23, 42, 0.08);
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    --grid: rgba(100, 116, 139, 0.12);
    --purple: #7c3aed;
    --purple-fill: rgba(124, 58, 237, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17;
      --panel: rgba(21, 27, 39, 0.75);
      --border: rgba(148, 163, 184, 0.14);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --faint: #64748b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --grid: rgba(148, 163, 184, 0.10);
      --purple: #a78bfa;
      --purple-fill: rgba(167, 139, 250, 0.12);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 28px 20px 40px;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    box-shadow: 0 0 12px rgba(124, 58, 237, .6);
  }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .cards {
    display: grid; gap: 12px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .card .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500;
             display: flex; align-items: center; gap: 6px; }
  .card .v {
    font-size: 22px; font-weight: 750; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .card.hero .v {
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .opt .v { color: #22c55e; } .mid .v { color: #3b82f6; } .pes .v { color: #ef4444; }
  .live-badge {
    display: none; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; color: #22c55e; letter-spacing: .05em;
  }
  .live-badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .live-badge.on { display: inline-flex; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .panel h2 { font-size: 15px; font-weight: 650; margin-bottom: 12px; letter-spacing: -0.01em; }
  .chart-box { position: relative; height: 340px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.8; margin-top: 10px; }
  #status { font-size: 12px; color: var(--faint); margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>币安 RLUSD 实时统计 & APR 预估</h1>
    <div class="sub">历史曲线每小时更新 · 头部数值由浏览器直连链上节点实时获取 · 每 10 分钟自动刷新</div>
  </header>

  <div class="cards">
    <div class="card hero"><div class="k">RLUSD 总量<span class="live-badge" id="badge-live">LIVE</span></div><div class="v" id="c-total">–</div></div>
    <div class="card opt"><div class="k">乐观 APR（利用率恒定）</div><div class="v" id="c-opt">–</div></div>
    <div class="card mid"><div class="k">中间 APR</div><div class="v" id="c-mid">–</div></div>
    <div class="card pes"><div class="k">悲观 APR（闲置恒定）</div><div class="v" id="c-pes">–</div></div>
    <div class="card"><div class="k">实时数据获取于</div><div class="v" id="c-time" style="font-size:16px">–</div></div>
  </div>

  <div class="panel">
    <h2>RLUSD 总量</h2>
    <div class="chart-box"><canvas id="chartTotal"></canvas></div>
  </div>

  <div class="panel">
    <h2>预估 APR（自第一周结算 07-24 08:00 起）</h2>
    <div class="chart-box"><canvas id="chartApr"></canvas></div>
    <div class="note" id="params-note"></div>
  </div>

  <div id="status"></div>
</div>

<script>
const fmtNum = (n, d = 0) => n == null ? '–' :
  n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const toUTC8 = t => {
  const d = new Date(new Date(t).getTime() + 8 * 3600e3);
  return d.toISOString().slice(5, 16).replace('T', ' ');
};
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---- 浏览器直连链上节点（均已验证 CORS）----
const LIVE = {
  ethRpcs: ['https://rpc.mevblocker.io', 'https://eth-mainnet.public.blastapi.io'],
  xrpRpcs: ['https://xrplcluster.com'],
  contract: '0x8292bb45bf1ee4d140127049757c2e0ff06317ed',
  ethAddrs: [
    '0x28c6c06298d514db089934071355e5743bf21d60',
    '0xdfd5293d8e347dfe59e90efd55b2956a1343963d',
    '0x21a31ee1afc51d94c2efccaa2092ad1028285549',
    '0x4ed6cf63bd9c009d247ee51224fc1c7041f517f1',
    '0x98adef6f2ac8572ec48965509d69a8dd5e8bba9d',
  ],
  xrpAddrs: ['rDAE53VfMvftPB4ogpWGWvzkQxfht6JPxr', 'rQUp2PKzH3vCtKs5H9tsPPE1rTsN6fhjqn'],
  xrpIssuer: 'rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De',
};

async function fetchLiveTotal() {
  const calls = LIVE.ethAddrs.map((a, i) => ({
    jsonrpc: '2.0', id: i, method: 'eth_call',
    params: [{ to: LIVE.contract, data: '0x70a08231' + a.slice(2).padStart(64, '0') }, 'latest'],
  }));
  let eth = null;
  for (const url of LIVE.ethRpcs) {
    try {
      const r = await fetch(url, { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(calls) });
      const arr = await r.json();
      arr.sort((x, y) => x.id - y.id);
      eth = arr.reduce((s, x) => s + Number(BigInt(x.result)) / 1e18, 0);
      break;
    } catch (e) { /* 换下一个节点 */ }
  }
  if (eth == null) throw new Error('ETH 节点均不可用');

  let xrp = 0;
  for (const a of LIVE.xrpAddrs) {
    const r = await fetch(LIVE.xrpRpcs[0], { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ method: 'account_lines',
        params: [{ account: a, peer: LIVE.xrpIssuer, ledger_index: 'validated', limit: 200 }] }) });
    const d = await r.json();
    xrp += (d.result.lines || []).reduce((s, l) => s + parseFloat(l.balance), 0);
  }
  return { total: eth + xrp, at: new Date().toISOString() };
}

let chartTotal = null, chartApr = null, cached = null, live = null;

function themeColors() {
  return { text: cssVar('--muted'), grid: cssVar('--grid'), purple: cssVar('--purple'),
           purpleFill: cssVar('--purple-fill') };
}

function liveAprs(total, p) {
  const pool = p.annual_reward_pool;
  const opt = pool / (total * p.week1_utilization) * 100;
  const utilizedPes = total - p.week1_unused;
  const pes = utilizedPes > 0 ? pool / utilizedPes * 100 : null;
  return { opt, pes, mid: pes == null ? null : (opt + pes) / 2 };
}

function render(data, liveData) {
  const hours = data.hours.filter(h => h.total != null);
  const p = data.params;
  const c = themeColors();
  const last = hours[hours.length - 1];

  // APR 预估只从第一周结算后开始显示
  const aprHours = hours.filter(h => h.t >= p.week1_window[1]);

  // 头部卡片：优先用实时值
  let head = { total: last.total, aprs: liveAprs(last.total, p), time: toUTC8(last.t) + ' (UTC+8 小时数据)' };
  if (liveData) {
    head = { total: liveData.total, aprs: liveAprs(liveData.total, p),
             time: toUTC8(liveData.at) + ' (UTC+8 实时)' };
  }
  document.getElementById('badge-live').classList.toggle('on', !!liveData);
  document.getElementById('c-total').textContent = fmtNum(head.total);
  document.getElementById('c-opt').textContent = fmtNum(head.aprs.opt, 2) + '%';
  document.getElementById('c-mid').textContent = fmtNum(head.aprs.mid, 2) + '%';
  document.getElementById('c-pes').textContent = head.aprs.pes == null ? '–' : fmtNum(head.aprs.pes, 2) + '%';
  document.getElementById('c-time').textContent = head.time;

  document.getElementById('params-note').textContent =
    `模型：周奖励固定 ${fmtNum(p.weekly_reward)} RLUSD（年化池 ${fmtNum(p.annual_reward_pool)}），` +
    `APR = 年化池 ÷ 利用金额。第一周（${p.week1_window[0].slice(0,10)} ~ ${p.week1_window[1].slice(0,10)}，` +
    `${p.week1_snapshot_hours} 个小时快照等权平均）：日均存款 ${fmtNum(p.week1_avg_deposit)}，` +
    `利用金额 ${fmtNum(p.week1_utilized)}，利用率 ${(p.week1_utilization * 100).toFixed(2)}%，` +
    `未利用 ${fmtNum(p.week1_unused)}。` +
    `乐观 = 利用率恒定 ${(p.week1_utilization * 100).toFixed(2)}%；` +
    `悲观 = 未利用资金恒定为第一周水平，其余资金全部参与瓜分。` +
    `注：当总存款低于第一周未利用资金时，悲观口径下利用金额 ≤ 0，模型失效，曲线留空。`;

  // 曲线数据；实时点追加在末尾（大圆点标记）
  const tLabels = hours.map(h => toUTC8(h.t));
  const tVals = hours.map(h => h.total);
  const aLabels = aprHours.map(h => toUTC8(h.t));
  const aOpt = aprHours.map(h => h.apr_optimistic);
  const aMid = aprHours.map(h => h.apr_mid);
  const aPes = aprHours.map(h => h.apr_pessimistic);
  const livePoint = ctx => liveData && ctx.dataIndex === ctx.dataset.data.length - 1 ? 4 : 0;
  if (liveData) {
    const lt = toUTC8(liveData.at);
    tLabels.push(lt); tVals.push(liveData.total);
    aLabels.push(lt); aOpt.push(head.aprs.opt); aMid.push(head.aprs.mid); aPes.push(head.aprs.pes);
  }

  Chart.defaults.color = c.text;
  Chart.defaults.borderColor = c.grid;
  const common = {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true, pointStyle: 'line' } } },
    scales: {
      x: { ticks: { maxTicksLimit: 12, maxRotation: 0 }, grid: { display: false } },
      y: { grid: { color: c.grid }, border: { display: false } },
    },
    elements: { point: { radius: 0 }, line: { borderWidth: 2, tension: 0.25 } },
  };

  const totalCfg = {
    type: 'line',
    data: { labels: tLabels, datasets: [{
      label: 'RLUSD 总量', data: tVals,
      borderColor: c.purple, backgroundColor: c.purpleFill, fill: true,
      pointRadius: livePoint, pointBackgroundColor: c.purple,
    }]},
    options: { ...common, scales: { ...common.scales,
      y: { ...common.scales.y, ticks: { callback: v => (v / 1e6).toFixed(0) + 'M' } } } },
  };

  const aprCfg = {
    type: 'line',
    data: { labels: aLabels, datasets: [
      { label: '乐观 APR', data: aOpt, borderColor: '#22c55e', pointRadius: livePoint, pointBackgroundColor: '#22c55e' },
      { label: '中间 APR', data: aMid, borderColor: '#3b82f6', pointRadius: livePoint, pointBackgroundColor: '#3b82f6' },
      { label: '悲观 APR', data: aPes, borderColor: '#ef4444', pointRadius: livePoint, pointBackgroundColor: '#ef4444' },
    ]},
    options: { ...common, scales: { ...common.scales,
      y: { ...common.scales.y, ticks: { callback: v => v + '%' } } },
      plugins: { ...common.plugins,
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmtNum(ctx.parsed.y, 2)}%` } } } },
  };

  if (chartTotal) { chartTotal.destroy(); chartApr.destroy(); }
  chartTotal = new Chart(document.getElementById('chartTotal'), totalCfg);
  chartApr = new Chart(document.getElementById('chartApr'), aprCfg);
}

async function load() {
  const status = document.getElementById('status');
  try {
    const resp = await fetch('data.json?_=' + Date.now(), { cache: 'no-store' });
    cached = await resp.json();
  } catch (e) {
    status.textContent = '历史数据加载失败: ' + e.message;
    return;
  }
  try {
    live = await fetchLiveTotal();
    status.textContent = '曲线更新至 ' + toUTC8(cached.hours[cached.hours.length - 1].t) +
      ' (UTC+8) · 实时值于 ' + toUTC8(live.at) + ' 从链上获取';
  } catch (e) {
    live = null;
    status.textContent = '实时链上获取失败（' + e.message + '），显示最近小时数据';
  }
  render(cached, live);
}

darkQuery.addEventListener('change', () => { if (cached) render(cached, live); });
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
