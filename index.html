<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币安 RLUSD 实时统计 & APR 预估</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: rgba(255, 255, 255, 0.85);
    --border: rgba(15, 23, 42, 0.08);
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    --grid: rgba(100, 116, 139, 0.12);
    --purple: #7c3aed;
    --purple-fill: rgba(124, 58, 237, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17;
      --panel: rgba(21, 27, 39, 0.75);
      --border: rgba(148, 163, 184, 0.14);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --faint: #64748b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --grid: rgba(148, 163, 184, 0.10);
      --purple: #a78bfa;
      --purple-fill: rgba(167, 139, 250, 0.12);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 28px 20px 40px;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    box-shadow: 0 0 12px rgba(124, 58, 237, .6);
  }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .cards {
    display: grid; gap: 12px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .card .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .card .v {
    font-size: 22px; font-weight: 750; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .card.hero .v {
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .mid .v { color: #f97316; }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .panel h2 { font-size: 15px; font-weight: 650; margin-bottom: 12px; letter-spacing: -0.01em; }
  .chart-box { position: relative; height: 340px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.8; margin-top: 10px; }
  #status { font-size: 12px; color: var(--faint); margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>币安 RLUSD 实时统计 & APR 预估</h1>
    <div class="sub">活动自 2026-07-17 08:00 (UTC+8) 起 · 每小时快照 · 数据每小时更新 · 页面每 10 分钟自动刷新</div>
  </header>

  <div class="cards">
    <div class="card hero"><div class="k">RLUSD 总量</div><div class="v" id="c-total">–</div></div>
    <div class="card mid"><div class="k">预估第五周 APR</div><div class="v" id="c-apr">–</div></div>
    <div class="card"><div class="k">数据更新至</div><div class="v" id="c-time" style="font-size:16px">–</div></div>
  </div>

  <div class="panel">
    <h2>RLUSD 总量 &amp; 第一~五周 APR（拟合曲线）</h2>
    <div class="chart-box"><canvas id="chartMain"></canvas></div>
    <div class="note" id="params-note"></div>
  </div>

  <div id="status"></div>
</div>

<script>
const fmtNum = (n, d = 0) => n == null ? '–' :
  n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const toUTC8 = t => {
  const d = new Date(new Date(t).getTime() + 8 * 3600e3);
  return d.toISOString().slice(5, 16).replace('T', ' ');
};
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let chartMain = null, cached = null;

function themeColors() {
  return { text: cssVar('--muted'), grid: cssVar('--grid'), purple: cssVar('--purple'),
           purpleFill: cssVar('--purple-fill') };
}

function render(data) {
  // 只显示活动期（07-17 起）数据：之前是活动开始前余额，无 APR 意义
  const hours = data.hours.filter(h => h.total != null && h.t >= data.params.apr_display_start);
  const labels = hours.map(h => toUTC8(h.t));
  const last = hours[hours.length - 1];
  const c = themeColors();

  document.getElementById('c-total').textContent = fmtNum(last.total);
  document.getElementById('c-apr').textContent = last.apr == null ? '–' : fmtNum(last.apr, 2) + '%';
  document.getElementById('c-time').textContent = toUTC8(last.t) + ' (UTC+8)';

  const p = data.params;
  document.getElementById('params-note').textContent =
    `模型：第五周奖池 ${fmtNum(p.weekly_reward)} 美元等值 XRP（年化池 ${fmtNum(p.annual_reward_pool)}），` +
    `APR = 年化池 ÷ 利用金额。四周未利用资金（总存款 − 利用金额）波动最小，按周际趋势外推第五周：` +
    p.fit_weeks.map((w, i) =>
      `第${'一二三四'[i]}周实际 ${(w.actual_apr * 100).toFixed(2)}%（日均存款 ` +
      `${(w.avg_deposit / 1e6).toFixed(1)}M → 利用 ${(w.utilized / 1e6).toFixed(1)}M，` +
      `未利用 ${(w.unused / 1e6).toFixed(1)}M）`).join('，') + '。' +
    `未利用资金周际变化 ${(p.unused_per_week / 1e6).toFixed(1)}M/周，第五周预期 ` +
    `${(p.unused_week5 / 1e6).toFixed(1)}M（趋势残差 ±${(p.unused_sigma / 1e6).toFixed(1)}M），` +
    `利用金额 = 总存款 − 该预期值。` +
    `曲线第一~四周按当周 200,000 池回算、第五周按 250,000 池，故 08-14 处含奖池提升的跳变。` +
    `注：总存款 ≤ 未利用预期值时模型失效，曲线留空。`;

  Chart.defaults.color = c.text;
  Chart.defaults.borderColor = c.grid;
  const common = {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true, pointStyle: 'line' } } },
    scales: {
      x: { ticks: { maxTicksLimit: 12, maxRotation: 0 }, grid: { display: false } },
      y: { grid: { color: c.grid }, border: { display: false } },
    },
    elements: { point: { radius: 0 }, line: { borderWidth: 2, tension: 0.25 } },
  };

  // 合并图：左轴 ETH+XRP 堆叠余额，右轴 APR 拟合曲线（07-17 前无 APR 数据，自动跳过）
  const mainCfg = {
    type: 'line',
    data: { labels, datasets: [
      { label: 'ETH 链', data: hours.map(h => h.eth),
        borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.22)',
        fill: true, stack: 'chain', yAxisID: 'y' },
      { label: 'XRP 链', data: hours.map(h => h.xrp),
        borderColor: '#14b8a6', backgroundColor: 'rgba(20,184,166,0.22)',
        fill: true, stack: 'chain', yAxisID: 'y' },
      { label: 'APR（拟合）', data: hours.map(h => h.apr),
        borderColor: '#f97316', borderWidth: 3, yAxisID: 'y1', spanGaps: true, order: -1 },
    ]},
    options: { ...common,
      scales: { x: common.scales.x,
        y: { ...common.scales.y, stacked: true,
             ticks: { callback: v => (v / 1e6).toFixed(0) + 'M' } },
        y1: { position: 'right', border: { display: false },
              grid: { drawOnChartArea: false },
              ticks: { color: '#f97316', callback: v => (+v).toFixed(2) + '%' } } },
      plugins: { ...common.plugins,
        tooltip: { callbacks: {
          label: ctx => ctx.dataset.yAxisID === 'y1'
            ? ` ${ctx.dataset.label}: ${fmtNum(ctx.parsed.y, 2)}%`
            : ` ${ctx.dataset.label}: ${fmtNum(ctx.parsed.y)}`,
          footer: items => ` 总量: ${fmtNum(items.filter(i => i.dataset.yAxisID === 'y')
            .reduce((s, i) => s + i.parsed.y, 0))}`,
        } } } },
  };

  if (chartMain) chartMain.destroy();
  chartMain = new Chart(document.getElementById('chartMain'), mainCfg);
}

async function load() {
  const status = document.getElementById('status');
  try {
    const resp = await fetch('data.json?_=' + Date.now(), { cache: 'no-store' });
    cached = await resp.json();
    render(cached);
    status.textContent = '上次页面刷新: ' + toUTC8(new Date().toISOString()) + ' (UTC+8)';
  } catch (e) {
    status.textContent = '数据加载失败: ' + e.message;
  }
}

darkQuery.addEventListener('change', () => { if (cached) render(cached); });
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
