<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币安 RLUSD 实时统计 & APR 预估</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #eef1f8;
    --panel: rgba(255, 255, 255, 0.66);
    --border: rgba(255, 255, 255, 0.7);
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --shadow: 0 2px 6px rgba(15,23,42,.05), 0 16px 40px rgba(15,23,42,.08);
    --grid: rgba(100, 116, 139, 0.14);
    --tooltip-bg: rgba(255, 255, 255, 0.92);
    --tooltip-text: #0f172a;
    --purple: #7c3aed;
    --zoom-fill: rgba(124, 58, 237, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070a12;
      --panel: rgba(17, 24, 39, 0.55);
      --border: rgba(148, 163, 184, 0.12);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --faint: #64748b;
      --shadow: 0 2px 6px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.45);
      --grid: rgba(148, 163, 184, 0.10);
      --tooltip-bg: rgba(15, 23, 42, 0.92);
      --tooltip-text: #e2e8f0;
      --purple: #a78bfa;
      --zoom-fill: rgba(167, 139, 250, 0.18);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 48px;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .4s, color .4s;
  }
  /* ---- 极光背景 ---- */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .aurora span {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1) {
    width: 46vw; height: 46vw; left: -12vw; top: -14vw;
    background: radial-gradient(circle, rgba(124,58,237,.35), transparent 65%);
  }
  .aurora span:nth-child(2) {
    width: 40vw; height: 40vw; right: -10vw; top: 6vh;
    background: radial-gradient(circle, rgba(37,99,235,.30), transparent 65%);
    animation-delay: -8s;
  }
  .aurora span:nth-child(3) {
    width: 38vw; height: 38vw; left: 26vw; bottom: -18vw;
    background: radial-gradient(circle, rgba(20,184,166,.26), transparent 65%);
    animation-delay: -16s;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vw, 4vh) scale(1.15); }
  }
  @media (prefers-color-scheme: dark) { .aurora span { opacity: .32; } }

  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 24px; animation: rise .6s ease both; }
  h1 {
    font-size: 23px; font-weight: 750; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    box-shadow: 0 0 14px rgba(124, 58, 237, .7);
  }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .cards {
    display: grid; gap: 14px; margin-bottom: 18px;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .25s ease, box-shadow .25s ease;
    animation: rise .6s ease both;
  }
  .card:hover { transform: translateY(-3px); }
  .card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; }
  .card:nth-child(4) { animation-delay: .15s; } .card:nth-child(5) { animation-delay: .2s; }
  .card .k { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
  .card .v {
    font-size: 23px; font-weight: 750; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .card.hero .v {
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .opt .v { color: #22c55e; } .mid .v { color: #3b82f6; } .pes .v { color: #ef4444; }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; margin-bottom: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    animation: rise .6s .1s ease both;
  }
  .panel h2 { font-size: 15px; font-weight: 650; margin-bottom: 8px; letter-spacing: -0.01em; }
  .chart-box { position: relative; height: 360px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.8; margin-top: 10px; }
  #status { font-size: 12px; color: var(--faint); margin-top: 6px; text-align: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>币安 RLUSD 实时统计 & APR 预估</h1>
    <div class="sub">自 2026-07-14 08:00 (UTC+8) 起每小时快照 · 数据每小时更新 · 页面每 10 分钟自动刷新 · 图表可拖拽缩放</div>
  </header>

  <div class="cards">
    <div class="card hero"><div class="k">RLUSD 总量</div><div class="v" id="c-total">–</div></div>
    <div class="card opt"><div class="k">乐观 APR（利用率恒定）</div><div class="v" id="c-opt">–</div></div>
    <div class="card mid"><div class="k">中间 APR</div><div class="v" id="c-mid">–</div></div>
    <div class="card pes"><div class="k">悲观 APR（闲置恒定）</div><div class="v" id="c-pes">–</div></div>
    <div class="card"><div class="k">数据更新至</div><div class="v" id="c-time" style="font-size:16px">–</div></div>
  </div>

  <div class="panel">
    <h2>RLUSD 总量</h2>
    <div class="chart-box" id="chartTotal"></div>
  </div>

  <div class="panel">
    <h2>预估 APR（自第一周结算 07-24 08:00 起）</h2>
    <div class="chart-box" id="chartApr"></div>
    <div class="note" id="params-note"></div>
  </div>

  <div id="status"></div>
</div>

<script>
const fmtNum = (n, d = 0) => n == null ? '–' :
  n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const toUTC8 = t => {
  const d = new Date(new Date(t).getTime() + 8 * 3600e3);
  return d.toISOString().slice(5, 16).replace('T', ' ');
};
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let chartTotal = null, chartApr = null, cached = null;

function themeColors() {
  return { text: cssVar('--muted'), faint: cssVar('--faint'), grid: cssVar('--grid'),
           tooltipBg: cssVar('--tooltip-bg'), tooltipText: cssVar('--tooltip-text'),
           purple: cssVar('--purple'), zoomFill: cssVar('--zoom-fill'),
           border: cssVar('--border') };
}

// 数字滚动动画
function animateValue(el, target, decimals, suffix = '') {
  if (target == null) { el.textContent = '–'; return; }
  const from = parseFloat(el.dataset.v || '0');
  const to = target;
  el.dataset.v = to;
  const t0 = performance.now(), dur = 800;
  (function step(t) {
    const k = Math.min((t - t0) / dur, 1);
    const e = 1 - Math.pow(1 - k, 3); // easeOutCubic
    el.textContent = fmtNum(from + (to - from) * e, decimals) + suffix;
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function baseOption(c, labels, yFormatter) {
  return {
    animationDuration: 700, animationEasing: 'cubicOut',
    grid: { left: 56, right: 18, top: 34, bottom: 52 },
    legend: { top: 0, left: 0, icon: 'roundRect', itemWidth: 16, itemHeight: 4,
              textStyle: { color: c.text, fontSize: 12 } },
    tooltip: {
      trigger: 'axis',
      backgroundColor: c.tooltipBg, borderColor: c.border,
      textStyle: { color: c.tooltipText, fontSize: 12 },
      axisPointer: { type: 'line', lineStyle: { color: c.faint, type: 'dashed' } },
      extraCssText: 'backdrop-filter: blur(8px); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15);',
    },
    xAxis: { type: 'category', data: labels, boundaryGap: false,
             axisLine: { lineStyle: { color: c.grid } }, axisTick: { show: false },
             axisLabel: { color: c.text, fontSize: 11 } },
    yAxis: { type: 'value', splitLine: { lineStyle: { color: c.grid } },
             axisLabel: { color: c.text, fontSize: 11, formatter: yFormatter } },
    dataZoom: [
      { type: 'inside', throttle: 60 },
      { type: 'slider', height: 18, bottom: 8, borderColor: 'transparent',
        backgroundColor: 'transparent', fillerColor: c.zoomFill,
        handleStyle: { color: c.purple }, moveHandleSize: 0,
        dataBackground: { lineStyle: { color: c.grid }, areaStyle: { color: c.zoomFill } },
        selectedDataBackground: { lineStyle: { color: c.purple } },
        textStyle: { color: c.faint, fontSize: 10 } },
    ],
  };
}

const grad = (top, bottom) => new echarts.graphic.LinearGradient(0, 0, 0, 1, [
  { offset: 0, color: top }, { offset: 1, color: bottom }]);

function totalOption(c, labels, hours) {
  const o = baseOption(c, labels, v => (v / 1e6).toFixed(0) + 'M');
  o.tooltip.formatter = ps => {
    let sum = 0, html = `<b>${ps[0].axisValueLabel}</b> (UTC+8)`;
    ps.forEach(p => { sum += p.value;
      html += `<br/>${p.marker} ${p.seriesName}: <b>${fmtNum(p.value)}</b>`; });
    return html + `<br/>总量: <b>${fmtNum(sum)}</b>`;
  };
  o.series = [
    { name: 'ETH 链', type: 'line', stack: 't', smooth: true, symbol: 'none',
      data: hours.map(h => h.eth),
      lineStyle: { width: 1.5, color: '#6366f1' },
      areaStyle: { color: grad('rgba(99,102,241,0.45)', 'rgba(99,102,241,0.03)') },
      emphasis: { focus: 'series' } },
    { name: 'XRP 链', type: 'line', stack: 't', smooth: true, symbol: 'none',
      data: hours.map(h => h.xrp),
      lineStyle: { width: 1.5, color: '#14b8a6' },
      areaStyle: { color: grad('rgba(20,184,166,0.45)', 'rgba(20,184,166,0.03)') },
      emphasis: { focus: 'series' } },
  ];
  return o;
}

function aprOption(c, labels, aprHours) {
  const o = baseOption(c, labels, v => v + '%');
  o.tooltip.formatter = ps => {
    let html = `<b>${ps[0].axisValueLabel}</b> (UTC+8)`;
    ps.forEach(p => { if (p.value != null)
      html += `<br/>${p.marker} ${p.seriesName}: <b>${fmtNum(p.value, 2)}%</b>`; });
    return html;
  };
  const mk = (name, key, color, glow) => ({
    name, type: 'line', smooth: true, symbol: 'none',
    data: aprHours.map(h => h[key]),
    lineStyle: { width: 2, color, shadowColor: glow, shadowBlur: 8 },
    emphasis: { focus: 'series' },
  });
  o.series = [
    mk('乐观 APR', 'apr_optimistic', '#22c55e', 'rgba(34,197,94,0.35)'),
    mk('中间 APR', 'apr_mid', '#3b82f6', 'rgba(59,130,246,0.35)'),
    mk('悲观 APR', 'apr_pessimistic', '#ef4444', 'rgba(239,68,68,0.35)'),
  ];
  return o;
}

function render(data) {
  const hours = data.hours.filter(h => h.total != null);
  const labels = hours.map(h => toUTC8(h.t));
  const last = hours[hours.length - 1];
  const c = themeColors();

  animateValue(document.getElementById('c-total'), last.total, 0);
  animateValue(document.getElementById('c-opt'), last.apr_optimistic, 2, '%');
  animateValue(document.getElementById('c-mid'), last.apr_mid, 2, '%');
  animateValue(document.getElementById('c-pes'), last.apr_pessimistic, 2, '%');
  document.getElementById('c-time').textContent = toUTC8(last.t) + ' (UTC+8)';

  const p = data.params;
  document.getElementById('params-note').textContent =
    `模型：周奖励固定 ${fmtNum(p.weekly_reward)} RLUSD（年化池 ${fmtNum(p.annual_reward_pool)}），` +
    `APR = 年化池 ÷ 利用金额。第一周（${p.week1_window[0].slice(0,10)} ~ ${p.week1_window[1].slice(0,10)}，` +
    `${p.week1_snapshot_hours} 个小时快照等权平均）：日均存款 ${fmtNum(p.week1_avg_deposit)}，` +
    `利用金额 ${fmtNum(p.week1_utilized)}，利用率 ${(p.week1_utilization * 100).toFixed(2)}%，` +
    `未利用 ${fmtNum(p.week1_unused)}。` +
    `乐观 = 利用率恒定 ${(p.week1_utilization * 100).toFixed(2)}%；` +
    `悲观 = 未利用资金恒定为第一周水平，其余资金全部参与瓜分。` +
    `注：当总存款低于第一周未利用资金时，悲观口径下利用金额 ≤ 0，模型失效，曲线留空。`;

  // APR 预估只从第一周结算后开始显示（之前已是实际值，预估无意义）
  const aprHours = hours.filter(h => h.t >= p.week1_window[1]);
  const aprLabels = aprHours.map(h => toUTC8(h.t));

  if (!chartTotal) {
    chartTotal = echarts.init(document.getElementById('chartTotal'));
    chartApr = echarts.init(document.getElementById('chartApr'));
    window.addEventListener('resize', () => { chartTotal.resize(); chartApr.resize(); });
  }
  // setOption 增量更新：自动刷新时保留用户的缩放/平移状态
  chartTotal.setOption(totalOption(c, labels, hours));
  chartApr.setOption(aprOption(c, aprLabels, aprHours));
}

async function load() {
  const status = document.getElementById('status');
  try {
    const resp = await fetch('data.json?_=' + Date.now(), { cache: 'no-store' });
    cached = await resp.json();
    render(cached);
    status.textContent = '上次页面刷新: ' + toUTC8(new Date().toISOString()) + ' (UTC+8)';
  } catch (e) {
    status.textContent = '数据加载失败: ' + e.message;
  }
}

function rebuild() {  // 主题切换时整体重建（ECharts 不支持运行时换肤）
  if (chartTotal) { chartTotal.dispose(); chartApr.dispose(); chartTotal = chartApr = null; }
  if (cached) render(cached);
}
darkQuery.addEventListener('change', rebuild);

load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
